name: Preview PR 9 README cards
on:
  push:
    branches: [preview/pr-9-readme-cards]
    paths: [.github/workflows/preview-readme-cards.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out reviewed generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pedrocatalao/github-cool-readme
          ref: 4c943f262bb789611b7492da1a904b73d004326c
          path: .cards-generator
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install locked runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix .cards-generator
      - name: Generate public profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .cards-generator/src/cli.ts --config cool-readme.yml --out stats --preview
      - name: Upload preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-9-readme-cards
          path: stats/
          if-no-files-found: error
          retention-days: 7
